<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 785" width="1200" height="785" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <style>
      .t  { fill:#1F2328; font-size:14px; font-weight:600; }
      .s  { fill:#57606A; font-size:11.5px; }
      .h  { fill:#1F2328; font-size:15px; font-weight:700; }
      .ln { stroke:#57606A; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .dl { stroke:#57606A; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .gh   { fill:#FFFFFF; stroke:#0969DA; stroke-width:1.5; }
      .aws  { fill:#FFF8EE; stroke:#E8890C; stroke-width:1.5; }
      .pod  { fill:#EEF9F0; stroke:#2DA44E; stroke-width:1.5; }
      .node { fill:#F6F8FA; stroke:#8C959F; stroke-width:1.2; }
    </style>
  </defs>

  <rect width="1200" height="785" fill="#FFFFFF"/>

  <!-- ================= GitHub Actions pipeline ================= -->
  <rect x="20" y="20" width="1160" height="130" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="36" y="45" class="h">GitHub Actions: CI/CD on every push to main</text>

  <g text-anchor="middle">
    <rect x="36"  y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="106" y="90" class="t">git push</text><text x="106" y="109" class="s">to main</text>

    <rect x="198" y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="268" y="90" class="t">Test + validate</text><text x="268" y="109" class="s">45 tests · infra checks</text>

    <rect x="360" y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="430" y="90" class="t">Gate</text><text x="430" y="109" class="s">deploy if env is up</text>

    <rect x="522" y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="592" y="90" class="t">terraform apply</text><text x="592" y="109" class="s">59 AWS resources</text>

    <rect x="684" y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="754" y="90" class="t">Build + push</text><text x="754" y="109" class="s">3 images → ECR :sha</text>

    <rect x="846" y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="916" y="90" class="t">Deploy to EKS</text><text x="916" y="109" class="s">auto-rollback</text>

    <rect x="1008" y="62" width="140" height="66" rx="8" class="gh"/>
    <text x="1078" y="90" class="t">Smoke test</text><text x="1078" y="109" class="s">live HTTPS, end to end</text>
  </g>
  <path d="M176 95 H196" class="ln"/>
  <path d="M338 95 H358" class="ln"/>
  <path d="M500 95 H520" class="ln"/>
  <path d="M662 95 H682" class="ln"/>
  <path d="M824 95 H844" class="ln"/>
  <path d="M986 95 H1006" class="ln"/>

  <!-- pipeline -> AWS -->
  <path d="M592 128 V194" class="dl"/>
  <text x="604" y="170" class="s">OIDC → CI role (no AWS keys stored in GitHub)</text>

  <!-- ================= Browser ================= -->
  <rect x="20" y="395" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="95" y="425" class="t" text-anchor="middle">User's browser</text>
  <text x="95" y="444" class="s" text-anchor="middle">HTTPS</text>

  <!-- ================= AWS account ================= -->
  <rect x="190" y="196" width="990" height="520" rx="10" fill="#FFFFFF" stroke="#E8890C" stroke-width="1.5"/>
  <text x="206" y="221" class="h">AWS account · us-east-2</text>

  <!-- Route 53 + ALB -->
  <rect x="206" y="250" width="180" height="66" rx="8" class="aws"/>
  <text x="296" y="277" class="t" text-anchor="middle">Route 53</text>
  <text x="296" y="296" class="s" text-anchor="middle">minutetaker.cloudscape.lol</text>

  <rect x="206" y="390" width="180" height="80" rx="8" class="aws"/>
  <text x="296" y="417" class="t" text-anchor="middle">Load balancer (ALB)</text>
  <text x="296" y="436" class="s" text-anchor="middle">TLS · ACM certificate</text>
  <text x="296" y="453" class="s" text-anchor="middle">HTTP → HTTPS redirect</text>
  <text x="296" y="490" class="s" text-anchor="middle">→ NodePort 30080 on each node</text>

  <path d="M95 395 V283 H204" class="dl"/>
  <text x="102" y="300" class="s">DNS lookup</text>
  <path d="M170 430 H204" class="ln"/>

  <!-- Bootstrap -->
  <rect x="206" y="540" width="180" height="150" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="296" y="565" class="t" text-anchor="middle">Bootstrap stack</text>
  <text x="296" y="588" class="s" text-anchor="middle">Terraform state (S3)</text>
  <text x="296" y="606" class="s" text-anchor="middle">GitHub OIDC provider</text>
  <text x="296" y="624" class="s" text-anchor="middle">CI role</text>
  <text x="296" y="652" class="s" text-anchor="middle" font-style="italic">kept on teardown: the</text>
  <text x="296" y="668" class="s" text-anchor="middle" font-style="italic">pipeline runs through it</text>

  <!-- VPC / EKS -->
  <rect x="410" y="240" width="500" height="450" rx="10" fill="#FBFAFF" stroke="#8C4FFF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="426" y="263" class="t">VPC 10.40.0.0/16 · EKS 1.35 cluster</text>

  <path d="M386 430 H408" class="ln"/>

  <!-- node a -->
  <rect x="428" y="280" width="226" height="390" rx="8" class="node"/>
  <text x="541" y="303" class="t" text-anchor="middle">Node · AZ a</text>
  <text x="541" y="320" class="s" text-anchor="middle">m7i-flex.large</text>
  <!-- node b -->
  <rect x="666" y="280" width="226" height="390" rx="8" class="node"/>
  <text x="779" y="303" class="t" text-anchor="middle">Node · AZ b</text>
  <text x="779" y="320" class="s" text-anchor="middle">m7i-flex.large</text>

  <g text-anchor="middle">
    <!-- pods node a -->
    <rect x="448" y="340" width="186" height="56" rx="8" class="pod"/>
    <text x="541" y="364" class="t">web</text><text x="541" y="382" class="s">nginx · UI + proxy</text>
    <rect x="448" y="426" width="186" height="56" rx="8" class="pod"/>
    <text x="541" y="450" class="t">api</text><text x="541" y="468" class="s">FastAPI · uploads, search</text>
    <rect x="448" y="512" width="186" height="56" rx="8" class="pod"/>
    <text x="541" y="536" class="t">worker</text><text x="541" y="554" class="s">Whisper · action items</text>
    <!-- pods node b -->
    <rect x="686" y="340" width="186" height="56" rx="8" class="pod"/>
    <text x="779" y="364" class="t">web</text><text x="779" y="382" class="s">nginx · UI + proxy</text>
    <rect x="686" y="426" width="186" height="56" rx="8" class="pod"/>
    <text x="779" y="450" class="t">api</text><text x="779" y="468" class="s">FastAPI · uploads, search</text>
    <rect x="686" y="512" width="186" height="56" rx="8" class="pod"/>
    <text x="779" y="536" class="t">worker</text><text x="779" y="554" class="s">scales 1–5 pods</text>
  </g>
  <path d="M541 396 V424" class="ln"/>
  <path d="M779 396 V424" class="ln"/>

  <text x="541" y="598" class="s" text-anchor="middle">autoscalers (HPA) · probes</text>
  <text x="541" y="615" class="s" text-anchor="middle">disruption budgets</text>
  <text x="779" y="598" class="s" text-anchor="middle">metrics-server</text>
  <text x="779" y="615" class="s" text-anchor="middle">pod identity agent</text>
  <text x="660" y="684" class="s" text-anchor="middle">replicas spread across both nodes / availability zones</text>

  <!-- managed services -->
  <rect x="940" y="250" width="222" height="62" rx="8" class="aws"/>
  <text x="1051" y="276" class="t" text-anchor="middle">DynamoDB</text>
  <text x="1051" y="295" class="s" text-anchor="middle">meetings + transcripts</text>

  <rect x="940" y="328" width="222" height="62" rx="8" class="aws"/>
  <text x="1051" y="354" class="t" text-anchor="middle">S3</text>
  <text x="1051" y="373" class="s" text-anchor="middle">uploaded audio (encrypted)</text>

  <rect x="940" y="406" width="222" height="62" rx="8" class="aws"/>
  <text x="1051" y="432" class="t" text-anchor="middle">SQS + dead-letter queue</text>
  <text x="1051" y="451" class="s" text-anchor="middle">transcription jobs</text>

  <rect x="940" y="484" width="222" height="62" rx="8" class="aws"/>
  <text x="1051" y="510" class="t" text-anchor="middle">ECR</text>
  <text x="1051" y="529" class="s" text-anchor="middle">3 images, tag = git commit</text>

  <path d="M910 281 H938" class="ln" marker-start="url(#arrow)"/>
  <path d="M910 359 H938" class="ln" marker-start="url(#arrow)"/>
  <path d="M910 437 H938" class="ln" marker-start="url(#arrow)"/>
  <path d="M938 515 H912" class="dl"/>
  <text x="925" y="506" class="s" text-anchor="middle">pull</text>

  <rect x="940" y="566" width="222" height="124" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="954" y="590" class="t">Least privilege</text>
  <text x="954" y="611" class="s">api and worker each get their own</text>
  <text x="954" y="628" class="s">IAM role (EKS Pod Identity), only</text>
  <text x="954" y="645" class="s">the calls their code makes. web</text>
  <text x="954" y="662" class="s">has none. No access keys anywhere;</text>
  <text x="954" y="679" class="s">pods can't use the node's role.</text>

  <!-- legend -->
  <path d="M206 738 H246" class="ln"/>
  <text x="254" y="742" class="s">request / data path</text>
  <path d="M392 738 H432" class="dl"/>
  <text x="440" y="742" class="s">setup, DNS, image pulls</text>
  <text x="206" y="768" class="s">Everything inside the orange box is created by infra/live and removed by teardown, except the bootstrap stack.</text>
</svg>
