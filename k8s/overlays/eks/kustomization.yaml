# EKS (the real environment). Differences from k8s/overlays/local:
#  * images come from ECR, tagged with the git commit (set by the pipeline:
#    `kustomize edit set image`), so every deploy is traceable to a commit
#  * DynamoDB / S3 / SQS names come from `terraform output` (config.env,
#    generated by scripts/render-config.sh, never committed)
#  * no AWS keys at all: the api and worker ServiceAccounts get IAM roles
#    through EKS Pod Identity (infra/live/pod-identity.tf)
#  * web is exposed on NodePort 30080, where the ALB forwards HTTPS traffic
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minutetaker
resources:
  - ../../base
configMapGenerator:
  - name: minutetaker-config
    behavior: replace
    envs: [config.env]
patches:
  - target: { kind: Service, name: web }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
